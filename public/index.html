<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup Generator</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f2f2f7; color: #1c1c1e; min-height: 100vh; }
.container { max-width: 720px; margin: 0 auto; padding: 48px 24px; }
h1 { font-size: 28px; font-weight: 700; margin-bottom: 6px; }
.subtitle { color: #6e6e73; font-size: 15px; margin-bottom: 40px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.zone { background: white; border: 2px dashed #d1d1d6; border-radius: 16px; padding: 24px; cursor: pointer; transition: border-color 0.15s; }
.zone.drag-over { border-color: #007aff; background: #f0f7ff; }
.zone-label { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
.zone-hint { font-size: 13px; color: #8e8e93; margin-bottom: 16px; }
.file-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.file-item { font-size: 13px; background: #f2f2f7; padding: 7px 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.file-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-item button { background: none; border: none; color: #c7c7cc; font-size: 16px; cursor: pointer; flex-shrink: 0; }
.file-item button:hover { color: #3a3a3c; }
input[type="file"] { display: none; }
.add-files { display: inline-block; font-size: 13px; color: #007aff; cursor: pointer; font-weight: 500; }
.settings { background: white; border-radius: 16px; padding: 20px 24px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }
.settings label { font-size: 14px; font-weight: 500; }
.settings select { border: 1px solid #d1d1d6; border-radius: 8px; padding: 6px 10px; font-size: 14px; background: white; }
#generate-btn { width: 100%; padding: 15px; background: #007aff; color: white; border: none; border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
#generate-btn:hover:not(:disabled) { background: #0063cc; }
#generate-btn:disabled { background: #aeaeb2; cursor: not-allowed; }
#progress-section { margin-top: 24px; background: white; border-radius: 16px; padding: 20px 24px; display: none; }
.bar-bg { background: #e5e5ea; border-radius: 999px; height: 6px; overflow: hidden; margin-bottom: 10px; }
.bar-fill { background: #007aff; height: 100%; width: 0%; transition: width 0.3s; border-radius: 999px; }
#status-text { font-size: 13px; color: #6e6e73; }
.error-item { font-size: 12px; color: #ff3b30; margin-top: 4px; }
#download-btn { display: none; width: 100%; padding: 15px; background: #34c759; color: white; border: none; border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 12px; }
#download-btn:hover { background: #28a745; }
</style>
</head>
<body>
<div class="container">
  <h1>Mockup Generator</h1>
  <p class="subtitle">Upload PSD-mockups og billeder — download en ZIP med alle kombinationer som JPG</p>

  <div class="grid">
    <div class="zone" id="psd-zone">
      <input type="file" id="psd-input" multiple accept=".psd,.PSD">
      <div class="zone-label">PSD Mockups</div>
      <div class="zone-hint">Én SmartObject pr. fil</div>
      <div class="file-list" id="psd-list"></div>
      <span class="add-files" onclick="document.getElementById('psd-input').click()">+ Tilføj PSD filer</span>
    </div>
    <div class="zone" id="img-zone">
      <input type="file" id="img-input" multiple accept="image/*">
      <div class="zone-label">Design billeder</div>
      <div class="zone-hint">PNG, JPG eller WebP</div>
      <div class="file-list" id="img-list"></div>
      <span class="add-files" onclick="document.getElementById('img-input').click()">+ Tilføj billeder</span>
    </div>
  </div>

  <div class="settings">
    <label>Format</label>
    <select id="format">
      <option value="jpg" selected>JPG</option>
      <option value="png">PNG</option>
    </select>
  </div>

  <div class="settings" id="quality-row">
    <label>JPG kvalitet</label>
    <select id="quality">
      <option value="100">100% — Maksimal</option>
      <option value="90" selected>90% — Høj</option>
      <option value="80">80% — Medium</option>
      <option value="70">70% — Lav</option>
    </select>
  </div>

  <button id="generate-btn">Generer mockups</button>

  <div id="progress-section">
    <div class="bar-bg"><div class="bar-fill" id="bar"></div></div>
    <div id="status-text">Behandler...</div>
    <div id="error-list"></div>
  </div>
  <button id="download-btn">Download ZIP</button>
</div>

<script>
const state = { psds: [], images: [] };

function setupZone(inputId, zoneId, listId, key) {
  const input = document.getElementById(inputId);
  const zone  = document.getElementById(zoneId);

  function add(files) {
    const arr = state[key];
    for (const f of files) if (!arr.find(x => x.name === f.name)) arr.push(f);
    render(listId, key);
  }

  input.addEventListener('change', () => { add(input.files); input.value = ''; });
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('drag-over'); add(e.dataTransfer.files); });
}

function render(listId, key) {
  document.getElementById(listId).innerHTML = state[key].map((f, i) => `
    <div class="file-item">
      <span title="${f.name}">${f.name}</span>
      <button onclick="remove('${key}',${i})">×</button>
    </div>`).join('');
}

window.remove = (key, i) => { state[key].splice(i, 1); render(key === 'psds' ? 'psd-list' : 'img-list', key); };

setupZone('psd-input', 'psd-zone', 'psd-list', 'psds');
setupZone('img-input', 'img-zone', 'img-list', 'images');

document.getElementById('format').addEventListener('change', function() {
  document.getElementById('quality-row').style.display = this.value === 'png' ? 'none' : '';
});

document.getElementById('generate-btn').addEventListener('click', async () => {
  if (!state.psds.length || !state.images.length) { alert('Upload mindst én PSD og ét billede.'); return; }

  const btn     = document.getElementById('generate-btn');
  const section = document.getElementById('progress-section');
  const bar     = document.getElementById('bar');
  const status  = document.getElementById('status-text');
  const errList = document.getElementById('error-list');

  btn.disabled = true;
  section.style.display = 'block';
  document.getElementById('download-btn').style.display = 'none';
  errList.innerHTML = '';
  bar.style.width = '0%';

  const total = state.psds.length * state.images.length;
  status.textContent = `Sender ${state.psds.length} PSD(er) og ${state.images.length} billede(r) til serveren...`;

  const form = new FormData();
  state.psds.forEach(f   => form.append('psds',   f));
  state.images.forEach(f => form.append('images', f));
  form.append('format',  document.getElementById('format').value);
  form.append('quality', document.getElementById('quality').value);

  try {
    // Animate bar while waiting
    let fake = 0;
    const fakeTimer = setInterval(() => {
      fake = Math.min(fake + 1, 90);
      bar.style.width = fake + '%';
    }, 300);

    const resp = await fetch('/generate', { method: 'POST', body: form });

    clearInterval(fakeTimer);

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({ error: resp.statusText }));
      throw new Error(err.error || resp.statusText);
    }

    const errors = resp.headers.get('X-Errors');
    if (errors) {
      JSON.parse(errors).forEach(e => {
        errList.innerHTML += `<div class="error-item">⚠ ${e}</div>`;
      });
    }

    bar.style.width = '100%';
    status.textContent = `Færdig — ${total} mockups genereret.`;

    const blob = await resp.blob();
    const url  = URL.createObjectURL(blob);
    const dl   = document.getElementById('download-btn');
    dl.style.display = 'block';
    dl.textContent = `Download ZIP (${total} filer)`;
    dl.onclick = () => { const a = document.createElement('a'); a.href = url; a.download = 'mockups.zip'; a.click(); };

  } catch (err) {
    status.textContent = 'Fejl: ' + err.message;
    bar.style.background = '#ff3b30';
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
